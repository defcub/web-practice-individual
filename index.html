<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enver - Digital Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="main-header" id="header">
        <div class="navbar content-wrap d-flex item-center space-between">
            
            <div class="logo d-flex item-center">
                <img src="assets/images/logo-icon.png" alt="Enver Logo">
                <span class="logo-text">Enver</span>
            </div>
            
            <nav class="nav-menu">
                <ul id="mainMenu" class="main-menu d-flex">
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Our Project</a></li>
                    <li><a href="#">About us</a></li>
                </ul> 
            </nav>

            <button class="btn btn-outline d-none-mobile">Contact us</button>

            <div id="iconBlock" class="menu-icon d-mobile-only">
                <img src="assets/images/icons/burger-icon.svg" id="iconOpen" alt="Menu">
                <i id="iconClose" class="fa-solid fa-xmark d-none"></i>
            </div>
            
        </div>
    </header>

    <main>
        <section class="section hero-section">
            <div class="content-wrap d-flex hero-wrap vertical-center animate-on-scroll">
                
                <img src="assets/images/vector-graphic.png" alt="zigzag" class="floating-icon icon-zigzag">
                <img src="assets/images/vector-doubleplay.png" alt="play" class="floating-icon icon-play">
                <img src="assets/images/vector-doublecircle.png" alt="circles" class="floating-icon icon-circles">
                <img src="assets/images/vector-plus.png" alt="plus" class="floating-icon icon-plus">

                <div class="hero-content">
                    <h1 class="hero-title">Build Your<br>Awesome<br>Platform</h1>
                    <p class="hero-subtitle">
                        Enver studio is a digital studio that offers several services such as UI/UX Design to developers, we will provide the best service for those of you who use our services.
                    </p>
                    <button class="btn btn-primary">
                        Our Services
                        <img src="assets/images/icons/arrow-up.svg" alt="arrow-up-icon">
                    </button>
                </div>

                <div class="hero-visual">
                    <div class="visual-composition animate-on-scroll">
                        <div class="diamond-outline"></div>
                        <div class="diamond-solid"></div>
                            <img src="assets/images/waves-group.svg" alt="background waves" class="vector-waves">                        
                        <div class="visual-mask">
                            <img src="assets/images/man.png" alt="Happy man pointing" class="hero-guy">
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>
    <script src="assets/js/main.js"></script>
</body>
</html>
